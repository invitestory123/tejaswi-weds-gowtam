    <style>
      /* Floating BGM Button */
      #bgmAudioBtn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8f1d3a 0%, #57102a 100%);
        border: 2px solid #e8a93c;
        box-shadow: 0 4px 18px rgba(87, 16, 42, 0.45), 0 0 10px rgba(232, 169, 60, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 9999;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }
      #bgmAudioBtn:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 22px rgba(87, 16, 42, 0.55), 0 0 14px rgba(232, 169, 60, 0.55);
      }
      #bgmAudioBtn:active {
        transform: scale(0.94);
      }
      #bgmAudioBtn svg {
        width: 22px;
        height: 22px;
        fill: #FFF9EF;
      }
      .bgm-spin {
        animation: bgmDiskSpin 6s linear infinite;
      }
      @keyframes bgmDiskSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Mobile screen fitting and cursive font un-cropping */
      .font-script,
      .text-gradient-sindoor,
      .text-gradient-gold {
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
        display: inline-block;
        padding-top: 0.16em;
        padding-bottom: 0.22em;
        padding-left: 0.08em;
        padding-right: 0.08em;
        margin-top: -0.16em;
        margin-bottom: -0.22em;
        overflow: visible !important;
      }

      @media (max-width: 640px) {
        img.animate-sway {
          max-height: 52px !important;
          width: 100% !important;
          object-fit: cover !important;
          object-position: top center !important;
        }

        .hero-content-wrapper {
          display: flex !important;
          flex-direction: column !important;
          justify-content: space-evenly !important;
          align-items: center !important;
          padding-top: 2px !important;
          padding-bottom: 32px !important;
          padding-left: 12px !important;
          padding-right: 12px !important;
          flex: 1 1 auto !important;
          min-height: 0 !important;
        }

        img.animate-float {
          max-height: 25vh !important;
          width: auto !important;
          max-width: 195px !important;
          object-fit: contain !important;
          margin-top: 4px !important;
          flex-shrink: 0 !important;
        }

        .pointer-events-none.absolute.-bottom-3.-left-4,
        .pointer-events-none.absolute.-bottom-3.-right-4 {
          width: 90px !important;
          opacity: 0.85;
        }
      }
    </style>

  <body>
    <div id="root"></div>

    <!-- Background Music Audio -->
    <audio id="weddingBgAudio" loop preload="auto" playsinline>
      <source src="./bgm.mp3" type="audio/mpeg">
      <source src="./gtbgm.mpeg" type="audio/mpeg">
      <source src="./editable/assets/bgm.mp3" type="audio/mpeg">
    </audio>

    <!-- Floating Audio Toggle Button -->
    <button id="bgmAudioBtn" type="button" aria-label="Toggle background music" title="Toggle background music">
      <svg id="bgmIconPlay" class="bgm-spin" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
      <svg id="bgmIconMuted" style="display:none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M4.27 3L3 4.27l9 9v.28c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4v-1.73l4.73 4.73c-.45.34-.98.59-1.57.73l.63 1.9c.89-.22 1.7-.62 2.39-1.15L19.73 21 21 19.73 4.27 3zM14 7h4V3h-6v5.18l2 2V7z"/>
      </svg>
    </button>

    <script>
      (function() {
        var audio = document.getElementById('weddingBgAudio');
        var btn = document.getElementById('bgmAudioBtn');
        var iconPlay = document.getElementById('bgmIconPlay');
        var iconMuted = document.getElementById('bgmIconMuted');
        var hasUserInteracted = false;

        if (window.WEDDING_DATA && window.WEDDING_DATA.bgm && window.WEDDING_DATA.bgm.src) {
          audio.src = window.WEDDING_DATA.bgm.src;
        }

        function updateUI(isPlaying) {
          if (isPlaying) {
            iconPlay.style.display = 'block';
            iconMuted.style.display = 'none';
            btn.classList.add('bgm-spin');
          } else {
            iconPlay.style.display = 'none';
            iconMuted.style.display = 'block';
            btn.classList.remove('bgm-spin');
          }
        }

        function playMusic() {
          if (!audio) return;
          audio.muted = false;
          var promise = audio.play();
          if (promise !== undefined) {
            promise.then(function() {
              updateUI(true);
            }).catch(function() {
              updateUI(false);
            });
          }
        }

        function pauseMusic() {
          if (!audio) return;
          audio.pause();
          updateUI(false);
        }

        function toggleMusic(e) {
          if (e) e.stopPropagation();
          if (audio.paused) {
            playMusic();
          } else {
            pauseMusic();
          }
        }

        btn.addEventListener('click', toggleMusic);

        // Auto-play music on the first user interaction anywhere
        function unlockAudio() {
          if (hasUserInteracted) return;
          hasUserInteracted = true;
          playMusic();
          window.removeEventListener('click', unlockAudio, true);
          window.removeEventListener('touchstart', unlockAudio, true);
          window.removeEventListener('keydown', unlockAudio, true);
        }

        window.addEventListener('click', unlockAudio, true);
        window.addEventListener('touchstart', unlockAudio, true);
        window.addEventListener('keydown', unlockAudio, true);

        // Attempt initial autoplay (if allowed by browser policy)
        playMusic();
      })();
    </script>
  </body>
